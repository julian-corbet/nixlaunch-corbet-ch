# One core, many shells.
#
# `core` is the launcher itself and imports no toolkit; `gtk` is one way of drawing it. A second
# shell -- a portable toolkit, or AppKit on macOS, where there is no layer shell at all -- is then
# a new member here rather than a fork of everything.
[workspace]
members = ["core", "gtk"]
resolver = "3"

# A launcher is judged on the delay between the keystroke and the window, so the build is tuned for
# the run rather than for the compile. Cross-crate inlining matters MORE now, not less: the split
# puts the model behind a crate boundary that only LTO can see through, and the hot path is
# thousands of small toolkit wrapper calls, each a thin shim over one C function -- exactly the
# shape LTO exists to collapse.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# `panic = "abort"` is NOT set, and that is a decision rather than an omission: the inventory
# threads catch a panicking inventory command and turn it into one unreachable column, which needs
# unwinding to work at all. Aborting would trade three working columns for none.
