[package]
name = "nixlaunch"
version = "0.1.0"
edition = "2024"

# The binary keeps the plain name: what a person installs and types is `nixlaunch`, whichever shell
# happens to be drawing it.
[[bin]]
name = "nixlaunch"
path = "src/main.rs"

[dependencies]
nixlaunch-core = { path = "../core" }
gtk4 = { version = "0.11.4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
# Parsing what an inventory command prints. The SHAPE of that JSON is core's (config::Inventory);
# running the command and reading its stdout is the shell's, so the parser lives on this side.
serde_json = "1.0.151"
