# ITS OWN WORKSPACE, deliberately.
#
# An empty `[workspace]` table stops this being absorbed into the parent one, which matters for a
# throwaway: Iced pulls a large dependency tree, and letting that into the shipping Cargo.lock
# would rebuild the real package and change what the nix and pacman builds resolve -- a measurement
# is not worth perturbing the thing being measured.
[workspace]

[package]
name = "shell-iced-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The point of the split: the prototype reuses the launcher itself and only has to draw.
nixlaunch-core = { path = "../../core" }
# TINY-SKIA, NOT THE DEFAULT. Iced defaults to wgpu -- a full GPU pipeline, which is the same
# class of cost as the Vulkan renderer GTK was measured to be wasting here. Comparing default Iced
# against cairo-rendered GTK would compare a GPU stack against a software one and call it a toolkit
# difference, so this is the software renderer against the software renderer.
iced = { version = "0.13", default-features = false, features = ["tiny-skia"] }

# Matching the shipping profile, or the comparison measures build settings rather than toolkits.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
